name: Check COURTSIDE
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'predictions/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm exec tsc --noEmit
      - name: Check notebook and dates
        run: pnpm test
      - name: Check official snapshots
        run: |
          python tests/data.test.py
          python tests/library-data.test.py
      - name: Build
        run: pnpm build
      - name: Check production account API and server rendering
        run: node scripts/check-account-worker.mjs
