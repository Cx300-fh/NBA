name: Archive account predictions
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/archive-account-picks.mjs', '.github/workflows/archive-account-picks.yml', 'data/account-service.json']
permissions:
  contents: write
  id-token: write
concurrency:
  group: community-prediction-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch anonymous monthly predictions
        run: node scripts/archive-account-picks.mjs
      - name: Commit monthly files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- predictions/community
          if ! git diff --cached --quiet; then
            git commit -m 'picks: archive community predictions'
            git pull --rebase origin main
            git push
          fi
