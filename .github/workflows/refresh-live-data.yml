name: Refresh live NBA feeds
on:
  schedule:
    # Best-effort scheduling, not a five-minute freshness guarantee. Avoid the hour boundary.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-live-data.py
      - tests/accounts.test.mjs
      - tests/api.test.mjs
      - lib/data-client.ts
      - app/api/nba/route.ts
      - lib/account-server.ts
      - scripts/update-data.py
      - scripts/update-archive.py
      - .github/workflows/refresh-live-data.yml
permissions:
  contents: write
concurrency:
  group: nba-live-feeds
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public JSON browser transport
        run: python -m pip install curl_cffi==0.16.3
      - name: Check feed safety and data integrity
        run: python tests/data.test.py
      - name: Refresh current-season feeds
        run: python scripts/update-live-data.py --season 2026-27
      - name: Report actual feed freshness
        if: always()
        run: |
          python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          now = dt.datetime.now(dt.timezone.utc)
          lines = ['## Feed freshness', '', 'Observed at ' + now.isoformat(), '',
                   'Cron is best effort; a successful run does not mean every feed refreshed.', '',
                   '| Feed | Collected at | Age (minutes) | Stale flag |', '|---|---|---:|---|']
          for name in ['scoreboard', 'schedule', 'players-2026-27', 'teams-2026-27', 'standings-2026-27', 'shots-2026-27', 'roster-2026-27']:
              try:
                  data = json.loads(Path('data/live', name + '.json').read_text())
                  stamp = data.get('updatedAt')
                  age = (now - dt.datetime.fromisoformat(stamp.replace('Z', '+00:00'))).total_seconds() / 60
                  stale = bool(data.get('stale'))
                  limit = 45 if name.startswith('shots') else 120 if name.startswith('roster') else 20
                  if stale or age > limit or age < -1:
                      print(f'::warning::{name}: age={age:.1f} minutes, stale={stale}')
                  lines.append(f'| {name} | {stamp} | {age:.1f} | {stale} |')
              except (OSError, ValueError, TypeError, AttributeError) as error:
                  print(f'::warning::{name}: freshness unavailable ({error})')
                  lines.append(f'| {name} | unavailable | — | unknown |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - name: Commit only live feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live/
          if ! git diff --staged --quiet; then
            git commit -m 'data: refresh live NBA feeds'
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi
